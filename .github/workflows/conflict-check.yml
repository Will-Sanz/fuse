# Reusable workflow: checks a pull request for conflicts with the branch it
# merges into, including ones git and the tests do not catch (detect/check.mjs).
# Posts the answer as a PR comment and fails the job when it finds a conflict.
#
# Call it from another repository's workflow; see docs/detect.md. It does not
# run on Fuse's own pull requests.
name: Conflict check

on:
  workflow_call:
    inputs:
      target:
        description: Path in the calling repository to its setup, typecheck and test commands (JSON). Without it the pair is only merged, not built or tested.
        type: string
        default: ''
      prepare:
        description: Command to run before the check, for example starting a test database.
        type: string
        default: ''
      node-version:
        description: Node.js version for the check and the repository's own tests (22 or later).
        type: string
        default: '24'
      fuse-ref:
        description: Fuse branch, tag or commit to run.
        type: string
        default: main
      a:
        description: Side A when not run on a pull request (a branch name).
        type: string
        default: ''
      b:
        description: Side B when not run on a pull request (a branch name).
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Fuse's conflict check
        env:
          FUSE_REF: ${{ inputs.fuse-ref }}
        run: |
          git clone --quiet https://github.com/Will-Sanz/fuse "$RUNNER_TEMP/fuse"
          git -C "$RUNNER_TEMP/fuse" checkout --quiet "$FUSE_REF"
          npm ci --prefix "$RUNNER_TEMP/fuse" --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Prepare
        if: inputs.prepare != ''
        env:
          PREPARE: ${{ inputs.prepare }}
        run: bash -c "$PREPARE"

      - name: Pick the two sides
        id: sides
        env:
          INPUT_A: ${{ inputs.a }}
          INPUT_B: ${{ inputs.b }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            # The head of a PR from a fork is not among the fetched branches.
            git fetch --quiet origin "pull/$PR_NUMBER/head"
            echo "a=$PR_HEAD" >> "$GITHUB_OUTPUT"
            echo "b=origin/$PR_BASE" >> "$GITHUB_OUTPUT"
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/task.txt"
          elif [ -n "$INPUT_A" ] && [ -n "$INPUT_B" ]; then
            echo "a=origin/$INPUT_A" >> "$GITHUB_OUTPUT"
            echo "b=origin/$INPUT_B" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/task.txt"
          else
            echo "::error::Run on a pull request, or pass inputs a and b"
            exit 1
          fi

      - name: Check for conflicts
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIDE_A: ${{ steps.sides.outputs.a }}
          SIDE_B: ${{ steps.sides.outputs.b }}
          TARGET: ${{ inputs.target }}
        run: |
          set +e
          node "$RUNNER_TEMP/fuse/detect/check.mjs" \
            --a "$SIDE_A" --b "$SIDE_B" \
            --task "$(cat "$RUNNER_TEMP/task.txt")" \
            ${TARGET:+--target "$TARGET"} \
            --summary "$RUNNER_TEMP/summary.md" \
            > "$RUNNER_TEMP/answer.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/answer.json"
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && steps.check.outputs.code != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/summary.md" --edit-last --create-if-none

      - name: Fail on a conflict or a failed check
        if: steps.check.outputs.code != '0'
        env:
          CODE: ${{ steps.check.outputs.code }}
        run: |
          if [ "$CODE" = "1" ]; then echo "::error::Conflict found"; else echo "::error::The check failed to run"; fi
          exit 1
